name: Update Channel Playlist

on:
  schedule:
    - cron: "*/7 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-channel-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest JSON
        run: |
          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "https://jjtvxweb.pages.dev/jstr4web.json" \
            -o jstr4web.json

      - name: Validate JSON
        run: |
          python -m json.tool jstr4web.json > /dev/null
          echo "JSON validation successful"

      - name: Generate M3U
        run: |
          python scripts/generate_m3u.py

      - name: Validate M3U
        run: |
          test -s channels.m3u
          grep -q "#EXTM3U" channels.m3u
          echo "M3U validation successful"

      - name: Show statistics
        run: |
          echo "Total EXTINF:"
          grep -c "#EXTINF" channels.m3u || true

          echo "DRM references:"
          grep -c "#DRM-REF:" channels.m3u || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jstr4web.json channels.m3u

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "Auto update channel playlist"
            git push
          fi
