name: Update JSON + DRM M3U

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download JSON
        run: |
          curl -fL --retry 3 \
            -o jstr4web.json \
            "https://jjtvxweb.pages.dev/jstr4web.json"

      - name: Validate JSON
        run: |
          python -m json.tool jstr4web.json > /dev/null
          echo "JSON is valid"

      - name: Generate M3U
        run: |
          python3 <<'PY'
          import json

          with open("jstr4web.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              channels = data.get("channels", data.get("data", [data]))
          else:
              channels = data

          if not isinstance(channels, list):
              raise SystemExit("Unsupported JSON structure")

          lines = ["#EXTM3U"]

          count = 0

          for ch in channels:
              if not isinstance(ch, dict):
                  continue

              name = ch.get("name", "").strip()
              url = ch.get("url", "").strip()
              logo = ch.get("logo", "").strip()
              category = ch.get("category", "Sports").strip()
              channel_id = str(ch.get("id", "")).strip()

              if not name or not url:
                  continue

              # Keep DRM as a configuration reference.
              # Do NOT put the actual decryption key into the public M3U.
              drm = "clearkey" if ch.get("keyId") and ch.get("key") else ""

              extinf = (
                  f'#EXTINF:-1 '
                  f'tvg-id="{channel_id}" '
                  f'tvg-name="{name}" '
                  f'group-title="{category}"'
              )

              if logo:
                  extinf += f' tvg-logo="{logo}"'

              extinf += f',{name}'

              lines.append(extinf)

              # MPD stream URL
              lines.append(url)

              # DRM configuration marker
              if drm:
                  lines.append(f'#DRM-CONFIG: {drm}')

              count += 1

          with open("channels.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Generated {count} channels")
          PY

      - name: Validate M3U
        run: |
          test -s channels.m3u
          head -20 channels.m3u

      - name: Commit changes
        run: |
          git add jstr4web.json channels.m3u

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update channels [$(date '+%d-%m-%Y %H:%M')]"
          git push origin main
